<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Parts Tracker E2E</title></head>
<body>
<script src="gas-stubs.js"></script>
<script>
/* End-to-end test: the real backend (Code.gs, Setup.gs) on in-memory sheets, driven through the real phone app.
   Serve the app folder over http and open test/e2e.html; results land in window.__result. */
(async () => {
  const log = [];
  let failed = 0;
  const check = (name, cond, detail) => { log.push((cond ? 'PASS ' : 'FAIL ') + name + (cond || detail === undefined ? '' : ' -> ' + JSON.stringify(detail))); if (!cond) failed++; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const waitFor = async (fn, ms = 4000) => { const end = Date.now() + ms; while (Date.now() < end) { try { const v = fn(); if (v) return v; } catch (e) {} await sleep(30); } return null; };
  const runScript = async path => { const s = document.createElement('script'); s.textContent = await (await fetch(path)).text(); document.head.appendChild(s); };
  const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.body.appendChild(s); });
  const finish = () => { window.__result = 'DONE ' + (failed ? failed + ' FAILED' : 'ALL PASSED') + '\n' + log.join('\n'); };
  try {
    try { localStorage.clear(); } catch (e) {}

    // ---- Backend on in-memory sheets ----
    await runScript('../backend/Code.gs');
    await runScript('../backend/Setup.gs');
    runSetup();
    check('editor setup (separate project) creates all tabs', Object.keys(SHEETS).every(n => SpreadsheetApp.getActiveSpreadsheet().getSheetByName(n)));
    loadSampleData_();
    const call = req => JSON.parse(doPost({ postData: { contents: JSON.stringify(req) } }).getContent());
    let apiDown = false, slowMs = 0;
    window.PT_MOCK_API = async req => {
      if (apiDown) { const e = new Error('No connection.'); e.code = 'offline'; throw e; }
      if (slowMs && req.action === 'submit') await sleep(slowMs);
      return call(req);
    };
    const saved = () => waitFor(() => $('doneStatus').textContent === 'Saved');
    const rows = name => readTable_(name);
    const stockOf = (siteId, fam) => stockBySite_(siteId)[fam] || 0;
    const site = rows('Sites')[0];
    check('sample data has 2 sites with tokens', rows('Sites').length === 2 && rows('Sites').every(s => String(s.Token).length === 32));
    check('PINs stored hashed, plain PIN cleared', rows('Users').every(u => u.PinHash && !u.PIN));
    check('part code column is called Part Number', SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Parts').getRange(1, 1).getValue() === 'Part Number');
    const partsTab = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Parts');
    partsTab.getRange(1, 1).setValue('Family');   // a Sheet made before the rename
    check('old "Family" heading is still read', rows('Parts').length === 11 && rows('Parts').every(p => /^P/.test(p.Family)));
    runSetup();
    check('setup renames "Family" to "Part Number"', partsTab.getRange(1, 1).getValue() === 'Part Number' && rows('Parts').length === 11 && !partsTab.getRange(1, 8).getValue());
    check('Sites tab has no Contact or Phone columns', !SHEETS.Sites.includes('Contact') && !SHEETS.Sites.includes('Phone') && !Object.keys(rows('Sites')[0]).some(k => k === 'Contact' || k === 'Phone'));
    // Columns can be moved in the Sheet: reverse Sites, Users and Movements, and everything after this must still work
    ['Sites', 'Users', 'Movements'].forEach(n => {
      const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(n);
      const w = sh.getLastColumn();
      sh.data = sh.data.map(r => { const line = r.slice(0, w); while (line.length < w) line.push(''); return line.reverse(); });
    });
    check('columns reversed for the rest of the test', SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Sites').getRange(1, 1).getValue() === 'LastCount' && rows('Sites')[0].Name === 'Sample Print Co');
    runSetup();
    check('setup leaves moved columns where they are', SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Sites').getRange(1, 1).getValue() === 'LastCount' && SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Sites').getLastColumn() === SHEETS.Sites.length);

    // ---- Code rule parity between backend and app ----
    await loadScript('../web/codes.js');
    const codes = ['FFB053K9189X', '059K58130', '676K 3364', 'P676K 3364X', 'PFB607K4403X', '338807E5651X', 'Roller', '127K 58960'];
    check('backend and app part code rules match', codes.every(c => JSON.stringify(normaliseCode(c)) === JSON.stringify(PTCodes.normalise(c))));

    // ---- Load the real app page for the sample site ----
    history.replaceState(null, '', location.pathname + '?s=' + site.Token);
    const html = await (await fetch('../web/index.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = '../web/app.css'; document.head.appendChild(css);
    Array.from(doc.body.children).filter(n => n.tagName !== 'SCRIPT').forEach(n => document.body.appendChild(document.importNode(n, true)));
    window.PT_CONFIG = { apiUrl: 'mock' };
    await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js');
    await loadScript('../web/scanner.js');
    await loadScript('../web/app.js');
    const $ = id => document.getElementById(id);
    const visible = id => !$(id).hidden;
    const A = window.PTApp;

    check('home shows the site', await waitFor(() => visible('view-home') && $('siteName').textContent === 'Sample Print Co'), $('siteName').textContent);
    check('parts list downloaded to the phone', A.state.parts.size === 11, A.state.parts.size);

    // ---- Customer books in a delivery, including a new part ----
    document.querySelector('[data-mode=BOOK_IN]').click();
    check('book in opens the scanner', await waitFor(() => visible('view-scan')));
    const buzz = [];
    navigator.vibrate = p => { buzz.push(JSON.stringify(p)); return true; };
    document.body.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
    A.handleCode('FFB059K6158X', 'barcode');
    check('known part scan buzzes once', buzz[0] === '90', buzz);
    A.handleCode('P059K6158X', 'barcode');
    A.handleCode('053K 91890', 'barcode');
    check('known parts added by name, repeats counted', A.state.basket.length === 2 && A.state.basket[0].qty === 2 && A.state.basket[0].name === 'Tray 1/2 Feed Roll', A.state.basket);
    A.handleCode('FFB999K12345', 'barcode');
    check('unknown part asks for a name', await waitFor(() => $('sheetTitle').textContent === 'Not in the parts list'));
    check('unknown part buzzes twice', buzz[buzz.length - 1] === '[70,60,70]', buzz);
    $('sheetBody').querySelector('input').value = 'Test Widget';
    Array.from($('sheetBody').querySelectorAll('button')).find(b => b.textContent === 'Add new part').click();
    check('new part added to basket', A.state.basket.some(b => b.family === 'P999K1234X' && b.isNew));
    $('scanNext').click();
    check('review shows 3 lines', await waitFor(() => visible('view-review') && $('reviewList').children.length === 3));
    check('no job number asked when booking in', $('jobCard').hidden);
    slowMs = 1500;
    const sentAt = Date.now();
    $('reviewSend').click();
    check('done screen shows at once while the server is slow', await waitFor(() => visible('view-done') && $('doneTitle').textContent === 'Booked in', 300) && Date.now() - sentAt < 500, Date.now() - sentAt);
    check('done screen says it is sending', $('doneStatus').textContent === 'Sending…', $('doneStatus').textContent);
    check('site stock updated on the phone before the server replies', (A.state.data.stock.find(s => s.family === 'P059K6158X') || {}).qty === 2, A.state.data.stock);
    check('recent activity marks it waiting to send', /waiting to send/.test($('recentList').textContent));
    check('booking in confirmed as saved', await saved(), $('doneStatus').textContent);
    slowMs = 0;
    check('stock recorded: feed roll 2, filter 1, new part 1',
      stockOf(site.SiteID, 'P059K6158X') === 2 && stockOf(site.SiteID, 'P053K9189X') === 1 && stockOf(site.SiteID, 'P999K1234X') === 1);
    const newPart = rows('Parts').find(p => p.Family === 'P999K1234X');
    check('new part saved unreviewed with its name', newPart && newPart.Name === 'Test Widget' && newPart.Reviewed === false, newPart);
    check('movement rows say who and how', rows('Movements').every(m => m.By === 'Customer' && m.Role === 'customer' && m.Type === 'BOOK_IN'));
    check('exact code kept on the movement', rows('Movements').some(m => m.ExactCode === 'P053K91890' && m.Family === 'P053K9189X'));
    $('doneHome').click();
    check('home shows recent activity', await waitFor(() => $('recentList').children.length === 3), $('recentList').children.length);

    // ---- Engineer: used on a job needs sign-in and a job number ----
    const tile = m => document.querySelector('[data-mode=' + m + ']');
    check('customers do not see Change site', $('changeSite').hidden);
    check('customers see only their tiles', tile('USED').hidden && tile('COUNT').hidden && !tile('CUSTOMER_FITTED').hidden && !tile('BOOK_IN').hidden);
    $('userChip').click();
    check('engineer sign in asks for a PIN', await waitFor(() => $('sheetTitle').textContent.includes('sign in')));
    const key = k => Array.from($('sheetBody').querySelectorAll('.keypad button')).find(b => b.textContent === k).click();
    ['1', '1', '1', '1', 'OK'].forEach(key);
    check('engineer tiles appear after sign in', await waitFor(() => !tile('USED').hidden && !tile('COUNT').hidden));
    check('My van switch appears straight after sign in, no reload', !$('whereSwitch').hidden);
    check('recent activity has in/out icons', $('recentList').querySelectorAll('.ricon.in').length > 0);
    tile('USED').click();
    check('engineer signed in and scanner opened', await waitFor(() => visible('view-scan') && A.state.user && A.state.user.name === 'Test Engineer'));
    check('used-on-a-job screen is pink', $('view-scan').classList.contains('tone-pink') && $('scanPill').textContent === 'Used on a job');
    A.handleCode('P059K6158X', 'barcode');
    $('scanNext').click();
    await waitFor(() => visible('view-review'));
    check('job number box shown', !$('jobCard').hidden);
    $('reviewSend').click();
    check('send blocked without a job number', await waitFor(() => !$('reviewError').hidden));
    $('jobNo').value = 'J1001';
    $('reviewSend').click();
    check('used on a job recorded', await waitFor(() => visible('view-done') && $('doneTitle').textContent === 'Recorded as used') && await saved());
    const used = rows('Movements').find(m => m.Type === 'USED');
    check('used row has job, engineer and -1', used && used.JobNo === 'J1001' && used.By === 'Test Engineer' && used.Qty === -1, used);

    // ---- Using more than is on record is recorded and flagged ----
    $('doneHome').click();
    document.querySelector('[data-mode=USED]').click();
    await waitFor(() => visible('view-scan'));
    A.handleCode('P053K9189X', 'barcode'); A.handleCode('P053K9189X', 'barcode');
    $('scanNext').click(); await waitFor(() => visible('view-review'));
    $('jobNo').value = 'J1002'; $('reviewSend').click();
    check('below-zero use is recorded and warned', await waitFor(() => visible('view-done') && !$('doneWarn').hidden), $('doneWarn').textContent);
    check('below-zero row has a note', rows('Movements').some(m => /below zero/.test(m.Note)));

    // ---- Stock count sets quantities and zeroes what was not found ----
    $('doneHome').click();
    document.querySelector('[data-mode=COUNT]').click();
    await waitFor(() => visible('view-scan'));
    ['P059K6158X', 'P059K6158X', 'P059K6158X'].forEach(c => A.handleCode(c, 'barcode'));
    $('scanNext').click(); await waitFor(() => visible('view-review'));
    const zeroFams = Array.from($('zeroList').querySelectorAll('input')).map(i => i.value);
    check('count lists parts on record but not scanned', zeroFams.includes('P999K1234X') && !zeroFams.includes('P053K9189X'), zeroFams);
    $('reviewSend').click();
    check('count saved', await waitFor(() => visible('view-done') && $('doneTitle').textContent === 'Count saved') && await saved());
    check('count result: feed roll 3, new part 0', stockOf(site.SiteID, 'P059K6158X') === 3 && stockOf(site.SiteID, 'P999K1234X') === 0);
    check('site last-count date set', !!rows('Sites')[0].LastCount);

    // ---- Offline: saved on the phone, sent later, never twice ----
    $('doneHome').click();
    apiDown = true;
    document.querySelector('[data-mode=BOOK_IN]').click();
    await waitFor(() => visible('view-scan'));
    A.handleCode('P004E1900X', 'barcode');
    $('scanNext').click(); await waitFor(() => visible('view-review'));
    $('reviewSend').click();
    check('offline send is kept on the phone', await waitFor(() => visible('view-done') && /saved on this phone/i.test($('doneStatus').textContent)), $('doneStatus').textContent);
    check('offline record shown in site stock straight away', (A.state.data.stock.find(s => s.family === 'P004E1900X') || {}).qty === 1);
    check('queue holds one record', A.state.queue.length === 1);
    const queued = JSON.parse(JSON.stringify(A.state.queue[0]));
    apiDown = false;
    await A.syncQueue(true);
    check('queued record sent when back online', A.state.queue.length === 0 && stockOf(site.SiteID, 'P004E1900X') === 1);
    const before = rows('Movements').length;
    const dup = call(Object.assign({ action: 'submit' }, queued));
    check('a resent record is ignored', dup.ok && dup.duplicate && rows('Movements').length === before, dup);

    // ---- My van: the engineer's own stock, no QR code ----
    appendObjects_('VanKit', [
      { Family: 'P059K6158X', Min: 2, Max: 4 },
      { Family: '059K58130', Min: 1, Max: 2 },      // box code: stored as P059K5813X
      { Family: 'P004E1900X', Min: 0, Max: 1 }
    ]);
    $('doneHome').click();
    check('engineer sees the Site / My van switch', await waitFor(() => !$('whereSwitch').hidden));
    document.querySelector('#whereSwitch [data-where=van]').click();
    check('My van opens for the signed-in engineer', await waitFor(() => visible('view-van') && $('vanName').textContent === 'Test Engineer'), $('vanName').textContent);
    check('empty van: kit lists the parts below minimum', await waitFor(() => $('vanKitList').children.length === 2), $('vanKitStatus').textContent);
    check('order quantity tops up to maximum', /Order 4/.test($('vanKitList').textContent) && /Order 2/.test($('vanKitList').textContent), $('vanKitList').textContent);

    document.querySelector('[data-van-mode=BOOK_IN]').click();
    check('van book-in screen', await waitFor(() => visible('view-scan') && $('scanTitle').textContent === 'Book in to my van'));
    A.handleCode('FFB059K61580', 'barcode'); A.handleCode('P059K6158X', 'barcode'); A.handleCode('P059K6158X', 'barcode');
    $('scanNext').click(); await waitFor(() => visible('view-review'));
    $('reviewSend').click();
    check('van book-in saved', await waitFor(() => visible('view-done') && $('doneHome').textContent === 'Back to my van') && await saved());
    check('stock recorded against the van', stockOf('VAN-E01', 'P059K6158X') === 3 && rows('Movements').some(m => m.SiteID === 'VAN-E01' && m.By === 'Test Engineer' && m.Type === 'BOOK_IN'));
    check('site stock not changed by a van book-in', stockOf(site.SiteID, 'P059K6158X') === 3);
    $('doneHome').click();
    check('back to the van after sending', await waitFor(() => visible('view-van')));
    check('kit check updated: only the nudger roll is short', await waitFor(() => JSON.stringify(A.vanShortfall().map(k => k.family)) === '["P059K5813X"]'), A.vanShortfall());
    check('order list for copying', A.orderLines().length === 1 && /P059K5813X/.test(A.orderLines()[0]) && /x2$/.test(A.orderLines()[0]), A.orderLines());
    // Order parts: review, then the Smartsheet form opens filled in
    window.PT_CONFIG.orderFormUrl = 'https://app.smartsheet.com/b/form/TESTFORM';
    let opened = null;
    window.open = url => { opened = url; };
    $('orderParts').click();
    check('order parts opens a review list', await waitFor(() => $('sheetTitle').textContent === 'Order van stock' && $('sheetBody').querySelectorAll('li').length === 1));
    [...$('sheetBody').querySelectorAll('button')].find(b => b.textContent === 'Open order form').click();
    const form = opened ? new URL(opened) : null;
    const f = k => form && form.searchParams.get(k);
    check('order form link goes to the Smartsheet form', form && form.origin + form.pathname === 'https://app.smartsheet.com/b/form/TESTFORM', opened);
    check('order form fixed fields filled in', f('Parts Reason') === 'CAR STOCK' && f('SD CALL No.') === 'Van Kit' && f('ByBox/Collection') === 'Yes' && f('Customer Name') === 'Test Engineer');
    check('order form part line filled in', f('1 Part No.') === 'P059K5813X' && f('1 Qty') === '2' && f('1 Description') === 'Tray 1/2 Feed Roll - Nudger', [f('1 Part No.'), f('1 Qty'), f('1 Description')]);
    check('ordered part is flagged and not ordered again', await waitFor(() => /Ordered/.test($('vanKitList').textContent)) && A.orderLines().length === 0);
    window.confirm = () => true;
    $('vanKitList').querySelector('.ordered-badge').click();
    check('tapping Ordered marks it as not ordered', A.orderLines().length === 1 && !$('vanKitList').querySelector('.ordered-badge'));
    $('orderParts').click();
    await waitFor(() => $('sheetTitle').textContent === 'Order van stock');
    [...$('sheetBody').querySelectorAll('button')].find(b => b.textContent === 'Open order form').click();
    check('re-ordered part shows the Ordered badge again', await waitFor(() => !!$('vanKitList').querySelector('.ordered-badge')));
    const sixParts = ['5 Part code', '5 qty', '5 Part Description '].every(k => new URL(A.smartsheetUrl([1, 2, 3, 4, 5].map(i => ({ family: 'P059K6158X', qty: i })))).searchParams.has(k));
    check('form row 5 uses its own field names (incl. trailing space)', sixParts);
    document.querySelector('[data-van-mode=BOOK_IN]').click();
    await waitFor(() => visible('view-scan'));
    A.handleCode('059K58130', 'barcode'); A.handleCode('059K58130', 'barcode');
    $('scanNext').click(); await waitFor(() => visible('view-review'));
    $('reviewSend').click();
    await waitFor(() => visible('view-done')); await saved();
    $('doneHome').click();
    check('booking the ordered part in clears it from the order list', await waitFor(() => visible('view-van') && A.vanShortfall().every(k => k.family !== 'P059K5813X')), A.vanShortfall());

    document.querySelector('[data-van-mode=USED]').click();
    await waitFor(() => visible('view-scan'));
    A.handleCode('P059K6158X', 'barcode');
    $('scanNext').click(); await waitFor(() => visible('view-review'));
    $('jobNo').value = 'J2001'; $('reviewSend').click();
    check('used on a job from the van', await waitFor(() => visible('view-done')) && await saved() && stockOf('VAN-E01', 'P059K6158X') === 2);
    const usedRow = rows('Movements').find(m => m.SiteID === 'VAN-E01' && m.Type === 'USED');
    check('van use has the job number', usedRow && usedRow.JobNo === 'J2001' && usedRow.Qty === -1, usedRow);

    const vanStock = call({ action: 'van', session: A.state.session });
    check('van data comes back for the engineer', vanStock.ok && vanStock.van.id === 'VAN-E01' && vanStock.kit.length === 3, vanStock);
    const vanNoSignIn = call({ action: 'submit', van: true, batchId: 'v1', type: 'BOOK_IN', items: [{ code: 'P059K6158X', qty: 1 }] });
    check('van needs a signed-in engineer', !vanNoSignIn.ok && vanNoSignIn.code === 'forbidden', vanNoSignIn);
    const vanFitted = call({ action: 'submit', van: true, session: A.state.session, batchId: 'v2', type: 'CUSTOMER_FITTED', items: [{ code: 'P059K6158X', qty: 1 }] });
    check('customer-fitted is not a van action', !vanFitted.ok && vanFitted.code === 'bad_request', vanFitted);

    $('doneHome').click();
    document.querySelector('#whereSwitch [data-where=site]').click();
    check('switch back to the site', await waitFor(() => visible('view-home') && $('siteName').textContent === 'Sample Print Co'));

    // ---- Change site: engineers move between sites in the same tab, no QR scan ----
    check('engineer sees Change site', !$('changeSite').hidden);
    $('changeSite').click();
    check('site list shows every site', await waitFor(() => $('sheetTitle').textContent === 'Change site' && $('sheetBody').querySelectorAll('.pick').length === 2));
    const siteSearch = $('sheetBody').querySelector('input');
    siteSearch.value = 'bradford'; siteSearch.dispatchEvent(new Event('input'));
    check('site list searches by town', $('sheetBody').querySelectorAll('.pick').length === 1);
    // A 300px phone keyboard: the sheet must sit above it, not behind it
    const vv = window.visualViewport, kbH = Math.min(300, innerHeight - 200);
    Object.defineProperty(vv, 'height', { configurable: true, get: () => innerHeight - kbH });
    Object.defineProperty(vv, 'offsetTop', { configurable: true, get: () => 0 });
    vv.dispatchEvent(new Event('resize'));
    const withKb = $('sheet').getBoundingClientRect();
    check('sheet sits 32px above the keyboard and fits the space left', Math.abs(withKb.bottom - (innerHeight - kbH - 32)) < 2 && withKb.top >= 0, [withKb.top, withKb.bottom, innerHeight, kbH]);
    delete vv.height; delete vv.offsetTop; vv.dispatchEvent(new Event('resize'));
    check('sheet back at the bottom when the keyboard closes', Math.abs($('sheet').getBoundingClientRect().bottom - innerHeight) < 2);
    $('sheetBody').querySelector('.pick').click();
    check('switched to the chosen site in the same tab', await waitFor(() => visible('view-home') && $('siteName').textContent === 'Demo Graphics Ltd'), $('siteName').textContent);
    check('chosen site remembered for next time', JSON.parse(localStorage.getItem('pt_site')) === rows('Sites')[1].Token && !location.search.includes('s='));
    $('changeSite').click();
    await waitFor(() => $('sheetBody').querySelectorAll('.pick').length === 2);
    check('recent sites listed first', /Recent sites first/.test($('sheetBody').textContent) && $('sheetBody').querySelector('.pick').textContent.includes('Demo Graphics'));
    [...$('sheetBody').querySelectorAll('.pick')].find(b => /Sample Print/.test(b.textContent)).click();
    check('switch back to the first site', await waitFor(() => visible('view-home') && $('siteName').textContent === 'Sample Print Co'));
    const sitesNoSignIn = call({ action: 'sites' });
    check('site list needs a signed-in engineer', !sitesNoSignIn.ok && sitesNoSignIn.code === 'session', sitesNoSignIn);

    // ---- Light / dark switch ----
    const themeBefore = document.documentElement.dataset.theme;
    $('themeBtn').click();
    const first = document.documentElement.dataset.theme;
    $('themeBtn').click();
    const second = document.documentElement.dataset.theme;
    check('theme button switches between light and dark', ['light', 'dark'].includes(first) && second !== first, [themeBefore, first, second]);
    check('theme choice remembered', JSON.parse(localStorage.getItem('pt_theme')) === second);
    check('theme button label says what it will do', $('themeBtn').getAttribute('aria-label') === (second === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'));

    // ---- Search ----
    check('search by partial code', A.searchParts('059K6').some(p => p.family === 'P059K6158X'));
    check('search by FFB code', A.searchParts('FFB059K61').some(p => p.family === 'P059K6158X'));
    check('search by name words', A.searchParts('feed roll').length === 2, A.searchParts('feed roll').map(p => p.name));

    // ---- Server-side protection ----
    const noSession = call({ action: 'submit', site: site.Token, batchId: 'x1', type: 'USED', jobNo: '1', items: [{ code: 'P059K6158X', qty: 1 }] });
    check('customer cannot record used parts', !noSession.ok && noSession.code === 'forbidden', noSession);
    const countAsCustomer = call({ action: 'submit', site: site.Token, batchId: 'x2', type: 'COUNT', items: [{ code: 'P059K6158X', qty: 9 }] });
    check('customer cannot do a stock count', !countAsCustomer.ok && countAsCustomer.code === 'forbidden');
    const badSite = call({ action: 'bootstrap', site: 'not-a-real-token-123456' });
    check('unknown QR token rejected', !badSite.ok && badSite.code === 'bad_site');
    const forged = call({ action: 'submit', site: site.Token, session: 'RTAxfDk5OTk5OTk5OTk5OTk5.forged', batchId: 'x3', type: 'USED', jobNo: '1', items: [{ code: 'P059K6158X', qty: 1 }] });
    check('forged session rejected', !forged.ok && forged.code === 'session', forged);
    const engSession = A.state.session;
    const adminAsEng = call({ action: 'admin', session: engSession });
    check('engineer cannot open admin', !adminAsEng.ok && adminAsEng.code === 'forbidden');
    let lockedOut = null;
    for (let i = 0; i < 6; i++) lockedOut = call({ action: 'login', site: 'lock-test', pin: '0000' });
    check('repeated wrong PINs lock sign-in', !lockedOut.ok && lockedOut.code === 'locked', lockedOut);

    check('engineers cannot change sites or machines', call({ action: 'siteSave', session: engLogin.session, name: 'X' }).code === 'forbidden' && call({ action: 'machineAdd', session: engLogin.session, siteId: 'S1001', model: 'SC180' }).code === 'forbidden');

    // ---- New-part sheet has no stray text ----
    $('doneHome').click();
    A.handleCode('FFB888K77770', 'photo');
    check('new-part sheet has no stray text', await waitFor(() => $('sheetTitle').textContent === 'Not in the parts list') && !/null|undefined/.test($('sheetBody').textContent), $('sheetBody').textContent);

    // ---- Fill every kit site with an assumed full kit ----
    const kitModels = kitsByModel_();
    const kitSites = rows('Sites').filter(s => isTrue_(s.Active) && rows('Printers').some(p => String(p.SiteID) === String(s.SiteID) && kitModels[cleanModel_(p.Model)]));
    const fullKit = s => { const want = {}; [...new Set(rows('Printers').filter(p => String(p.SiteID) === String(s.SiteID)).map(p => cleanModel_(p.Model)))]
      .filter(m => kitModels[m]).forEach(m => Object.keys(kitModels[m]).forEach(f => { want[f] = (want[f] || 0) + kitModels[m][f]; })); return want; };
    rows('Sites').filter(s => s.SiteID === 'S1001').forEach(s => SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Sites').getRange(s._row, col_('Sites', 'Active')).setValue(false));
    appendObjects_('Sites', [{ SiteID: 'S1999', Name: 'Training Centre', Address: 'Leeds', Postcode: 'LS1 1AA', Token: 'trainingtoken', Active: true }]);
    appendObjects_('Printers', [{ SiteID: 'S1999', Model: 'PC1120', Serial: 'TRAIN-1', NoKit: true }]);
    check('No kit column added to Printers and read back', rows('Printers').some(p => p.SiteID === 'S1999' && isTrue_(p.NoKit)));
    const closedBefore = JSON.stringify(stockBySite_('S1001'));
    const movesBefore = rows('Movements').length;
    previewKitStock();
    check('kit preview changes nothing', rows('Movements').length === movesBefore);
    sendDailyKitReport(); mail.length = 0;
    fillKitStock();
    check('every open kit site now holds at least a full kit', kitSites.length > 0 && kitSites.filter(s => s.SiteID !== 'S1001').every(s => { const st = stockBySite_(s.SiteID), w = fullKit(s); return Object.keys(w).every(f => (st[f] || 0) >= w[f]); }));
    check('assumed kit stock is a BOOK_IN marked not yet checked', rows('Movements').slice(movesBefore).length > 0 && rows('Movements').slice(movesBefore).every(m => m.Type === 'BOOK_IN' && /not yet checked/.test(m.Note) && m.Qty > 0));
    check('closed sites get no kit', JSON.stringify(stockBySite_('S1001')) === closedBefore);
    check('a machine ticked No kit gets no kit', Object.keys(stockBySite_('S1999')).length === 0);
    const trainAdmin = actionAdmin({ session: call({ action: 'login', site: 'admin', pin: '9999' }).session }).sites.find(x => x.id === 'S1999');
    check('admins see the training machine as no kit', trainAdmin && trainAdmin.machines[0].noKit === true);
    // Headings typed differently and other ways of ticking still count
    const prSheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Printers');
    prSheet.getRange(1, col_('Printers', 'NoKit')).setValue('No Kit ');
    const trainRow = rows('Printers').find(p => p.SiteID === 'S1999')._row;
    const tickedAs = v => { prSheet.getRange(trainRow, col_('Printers', 'NoKit')).setValue(v); return kitTopUp_().some(k => k.site.SiteID === 'S1999'); };
    check('No kit works with heading "No Kit " and values x, Yes, ✓, true', !tickedAs('x') && !tickedAs('Yes') && !tickedAs('✓') && !tickedAs(true) && tickedAs(false) && tickedAs(''), rows('Printers').find(p => p.SiteID === 'S1999'));
    tickedAs(true);
    const prCols = prSheet.getLastColumn(); runSetup();
    check('setup does not add a second No kit column', prSheet.getLastColumn() === prCols);
    appendObjects_('Movements', [{ MovementID: 'x1', Timestamp: new Date(), SiteID: 'S1999', Family: 'P059K6158X', ExactCode: 'P059K6158X', Qty: -1, Type: 'USED', By: 'T', Role: 'engineer' }]);
    check('parts used on a No kit machine are left out of the kit email', !kitUsage_(new Date(Date.now() - 60000), new Date(Date.now() + 1000)).some(u => u.site.SiteID === 'S1999'));
    appendObjects_('Movements', [{ MovementID: 'x2', Timestamp: new Date(), SiteID: 'S1999', Family: 'P059K6158X', ExactCode: 'P059K6158X', Qty: 1, Type: 'COUNT', By: 'T', Role: 'engineer' }]);
    const movesAfter = rows('Movements').length;
    fillKitStock();
    check('running it again adds nothing', rows('Movements').length === movesAfter);
    check('filling kits does not trigger the kit email', sendDailyKitReport() === 0 && mail.length === 0);
  } catch (e) {
    check('test run crashed', false, String(e && e.stack || e));
  }
  finish();
})();
</script>
</body>
</html>
