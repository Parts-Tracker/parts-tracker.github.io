<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Parts Tracker E2E</title></head>
<body>
<script src="gas-stubs.js"></script>
<script src="sample-data.js"></script>
<script>
/* End-to-end test: the real backend (Code.gs, Setup.gs) on in-memory sheets, driven through the real phone app.
   Serve the app folder over http and open test/e2e.html; results land in window.__result. */
(async () => {
  const log = [];
  let failed = 0;
  const check = (name, cond, detail) => { log.push((cond ? 'PASS ' : 'FAIL ') + name + (cond || detail === undefined ? '' : ' -> ' + JSON.stringify(detail))); if (!cond) failed++; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const waitFor = async (fn, ms = 4000) => { const end = Date.now() + ms; while (Date.now() < end) { try { const v = fn(); if (v) return v; } catch (e) {} await sleep(30); } return null; };
  const runScript = async path => { const s = document.createElement('script'); s.textContent = await (await fetch(path)).text(); document.head.appendChild(s); };
  const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.body.appendChild(s); });
  const finish = () => { window.__result = 'DONE ' + (failed ? failed + ' FAILED' : 'ALL PASSED') + '\n' + log.join('\n'); };
  try {
    try { localStorage.clear(); } catch (e) {}

    // ---- Backend on in-memory sheets ----
    await runScript('../backend/Code.gs');
    await runScript('../backend/Setup.gs');
    runSetup();
    check('editor setup (separate project) creates all tabs', Object.keys(SHEETS).every(n => SpreadsheetApp.getActiveSpreadsheet().getSheetByName(n)));
    loadSampleData_();
    const call = req => JSON.parse(doPost({ postData: { contents: JSON.stringify(req) } }).getContent());
    let apiDown = false, slowMs = 0, slowAll = false;
    window.PT_MOCK_API = async req => {
      if (apiDown) { const e = new Error('No connection.'); e.code = 'offline'; throw e; }
      if (slowMs && (req.action === 'submit' || slowAll)) await sleep(slowMs);
      return call(req);
    };
    const saved = () => waitFor(() => $('doneStatus').textContent === 'Saved');
    const rows = name => readTable_(name);
    const stockOf = (siteId, fam) => stockBySite_(siteId)[fam] || 0;
    const site = rows('Sites')[0];
    check('sample data has 2 sites with tokens', rows('Sites').length === 2 && rows('Sites').every(s => String(s.Token).length === 32));
    check('PINs stored hashed, plain PIN cleared', rows('Users').every(u => u.PinHash && !u.PIN));
    check('part code column is called Part Number', SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Parts').getRange(1, 1).getValue() === 'Part Number');
    check('the sample-data loader is not in the backend', typeof runSampleData === 'undefined' && typeof menuSampleData === 'undefined' && !/sample/i.test(onOpen.toString()));
    check('Sites tab has no Contact or Phone columns', !SHEETS.Sites.includes('Contact') && !SHEETS.Sites.includes('Phone') && !Object.keys(rows('Sites')[0]).some(k => k === 'Contact' || k === 'Phone'));
    // Columns can be moved in the Sheet: reverse Sites, Users and Movements, and everything after this must still work
    ['Sites', 'Users', 'Movements'].forEach(n => {
      const sh = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(n);
      const w = sh.getLastColumn();
      sh.data = sh.data.map(r => { const line = r.slice(0, w); while (line.length < w) line.push(''); return line.reverse(); });
    });
    check('columns reversed for the rest of the test', SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Sites').getRange(1, 1).getValue() === 'LastCount' && rows('Sites')[0].Name === 'Sample Print Co');
    runSetup();
    check('setup leaves moved columns where they are', SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Sites').getRange(1, 1).getValue() === 'LastCount' && SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Sites').getLastColumn() === SHEETS.Sites.length);

    // ---- Code rule parity between backend and app ----
    await loadScript('../web/codes.js');
    const codes = ['FFB053K9189X', '059K58130', '676K 3364', 'P676K 3364X', 'PFB607K4403X', '338807E5651X', 'Roller', '127K 58960'];
    check('backend and app part code rules match', codes.every(c => JSON.stringify(normaliseCode(c)) === JSON.stringify(PTCodes.normalise(c))));

    // ---- Load the real app page for the sample site ----
    history.replaceState(null, '', location.pathname + '?s=' + site.Token);
    const html = await (await fetch('../web/index.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = '../web/app.css'; document.head.appendChild(css);
    Array.from(doc.body.children).filter(n => n.tagName !== 'SCRIPT').forEach(n => document.body.appendChild(document.importNode(n, true)));
    window.PT_CONFIG = { apiUrl: 'mock' };
    await loadScript('https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js');
    await loadScript('../web/scanner.js');
    await loadScript('../web/outbox.js');
    indexedDB.deleteDatabase('pt-outbox');
    await loadScript('../web/app.js');
    const $ = id => document.getElementById(id);
    const visible = id => !$(id).hidden;
    const A = window.PTApp;

    check('home shows the site', await waitFor(() => visible('view-home') && $('siteName').textContent === 'Sample Print Co'), $('siteName').textContent);
    check('parts list downloaded to the phone', A.state.parts.size === 11, A.state.parts.size);

    // ---- Customer books in a delivery, including a new part ----
    document.querySelector('[data-mode=BOOK_IN]').click();
    check('book in opens the scanner', await waitFor(() => visible('view-scan')));
    const buzz = [];
    navigator.vibrate = p => { buzz.push(JSON.stringify(p)); return true; };
    document.body.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
    A.handleCode('FFB059K6158X', 'barcode');
    check('known part scan buzzes once', buzz[0] === '90', buzz);
    A.handleCode('P059K6158X', 'barcode');
    A.handleCode('053K 91890', 'barcode');
    check('known parts added by name, repeats counted', A.state.basket.length === 2 && A.state.basket[0].qty === 2 && A.state.basket[0].name === 'Tray 1/2 Feed Roll', A.state.basket);
    A.handleCode('FFB999K12345', 'barcode');
    check('unknown part asks for a name', await waitFor(() => $('sheetTitle').textContent === 'Not in the parts list'));
    check('unknown part buzzes twice', buzz[buzz.length - 1] === '[70,60,70]', buzz);
    $('sheetBody').querySelector('input').value = 'Test Widget';
    Array.from($('sheetBody').querySelectorAll('button')).find(b => b.textContent === 'Add new part').click();
    check('new part added to basket', A.state.basket.some(b => b.family === 'P999K1234X' && b.isNew));
    $('scanNext').click();
    check('review shows 3 lines', await waitFor(() => visible('view-review') && $('reviewList').children.length === 3));
    check('no job number asked when booking in', $('jobCard').hidden);
    slowMs = 1500;
    const sentAt = Date.now();
    $('reviewSend').click();
    check('done screen shows at once while the server is slow', await waitFor(() => visible('view-done') && $('doneTitle').textContent === 'Booked in', 300) && Date.now() - sentAt < 500, Date.now() - sentAt);
    check('done screen says it is sending', $('doneStatus').textContent === 'Sending…', $('doneStatus').textContent);
    check('site stock updated on the phone before the server replies', (A.state.data.stock.find(s => s.family === 'P059K6158X') || {}).qty === 2, A.state.data.stock);
    check('recent activity marks it waiting to send', /waiting to send/.test($('recentList').textContent));
    check('booking in confirmed as saved', await saved(), $('doneStatus').textContent);
    slowMs = 0;
    check('stock recorded: feed roll 2, filter 1, new part 1',
      stockOf(site.SiteID, 'P059K6158X') === 2 && stockOf(site.SiteID, 'P053K9189X') === 1 && stockOf(site.SiteID, 'P999K1234X') === 1);
    const newPart = rows('Parts').find(p => p.Family === 'P999K1234X');
    check('new part saved unreviewed with its name', newPart && newPart.Name === 'Test Widget' && newPart.Reviewed === false, newPart);
    check('movement rows say who and how', rows('Movements').every(m => m.By === 'Customer' && m.Role === 'customer' && m.Type === 'BOOK_IN'));
    check('exact code kept on the movement', rows('Movements').some(m => m.ExactCode === 'P053K91890' && m.Family === 'P053K9189X'));
    $('doneHome').click();
    check('home shows recent activity', await waitFor(() => $('recentList').children.length === 3), $('recentList').children.length);

    // ---- Engineer: used on a job needs sign-in and a job number ----
    const tile = m => document.querySelector('[data-mode=' + m + ']');
    check('customers do not see Change site, Find a part or count prompts', $('changeSite').hidden && $('findPart').hidden && $('recountCard').hidden);
    check('customers see only their tiles', tile('USED').hidden && tile('COUNT').hidden && tile('TO_VAN').hidden && !tile('CUSTOMER_FITTED').hidden && !tile('BOOK_IN').hidden);
    const shownTiles = () => [...$('siteActions').children].filter(b => !b.hidden).map(b => b.dataset.mode || b.id);
    check('customers: Book in and We fitted side by side, View stock full width underneath',
      JSON.stringify(shownTiles()) === '["BOOK_IN","CUSTOMER_FITTED","viewStockBtn"]' && $('viewStockBtn').offsetWidth === $('siteActions').offsetWidth && tile('BOOK_IN').offsetWidth < $('siteActions').offsetWidth * 0.6, shownTiles());
    $('userChip').click();
    check('engineer sign in asks for a PIN', await waitFor(() => $('sheetTitle').textContent.includes('sign in')));
    const key = k => Array.from($('sheetBody').querySelectorAll('.keypad button')).find(b => b.textContent === k).click();
    ['1', '1', '1', '1', 'OK'].forEach(key);
    check('engineer tiles appear after sign in', await waitFor(() => !tile('USED').hidden && !tile('COUNT').hidden));
    check('My van switch appears straight after sign in, no reload', !$('whereSwitch').hidden);
    check("engineers: the customer's tiles keep their place, engineer tiles beside and below them",
      JSON.stringify(shownTiles()) === '["BOOK_IN","TO_VAN","CUSTOMER_FITTED","viewStockBtn","USED","COUNT"]' && !$('viewStockBtn').classList.contains('full') &&
      tile('BOOK_IN').offsetTop === tile('TO_VAN').offsetTop && tile('USED').offsetTop > $('viewStockBtn').offsetTop, shownTiles());
    check('My van: Book in and Return to Ceva side by side', document.querySelector('[data-van-mode=BOOK_IN]').nextElementSibling === document.querySelector('[data-van-mode=RETURNED]') &&
      document.querySelector('[data-van-mode=BOOK_IN]').parentNode.classList.contains('action-grid'));
    check('recent activity has in/out icons', $('recentList').querySelectorAll('.ricon.in').length > 0);
    tile('USED').click();
    check('engineer signed in and scanner opened', await waitFor(() => visible('view-scan') && A.state.user && A.state.user.name === 'Test Engineer'));
    check('used-on-a-job screen is pink', $('view-scan').classList.contains('tone-pink') && $('scanPill').textContent === 'Used on a job');
    A.handleCode('P059K6158X', 'barcode');
    $('scanNext').click();
    await waitFor(() => visible('view-review'));
    check('job number box shown', !$('jobCard').hidden);
    $('reviewSend').click();
    check('send blocked without a job number', await waitFor(() => !$('reviewError').hidden));
    $('jobNo').value = 'J1001';
    $('reviewSend').click();
    check('used on a job recorded', await waitFor(() => visible('view-done') && $('doneTitle').textContent === 'Recorded as used') && await saved());
    const used = rows('Movements').find(m => m.Type === 'USED');
    check('used row has job, engineer and -1', used && used.JobNo === 'J1001' && used.By === 'Test Engineer' && used.Qty === -1, used);

    // ---- Using more than is on record is recorded and flagged ----
    $('doneHome').click();
    document.querySelector('[data-mode=USED]').click();
    await waitFor(() => visible('view-scan'));
    A.handleCode('P053K9189X', 'barcode'); A.handleCode('P053K9189X', 'barcode');
    $('scanNext').click(); await waitFor(() => visible('view-review'));
    $('jobNo').value = 'J1002'; $('reviewSend').click();
    check('below-zero use is recorded and warned', await waitFor(() => visible('view-done') && !$('doneWarn').hidden), $('doneWarn').textContent);
    check('below-zero row has a note', rows('Movements').some(m => /below zero/.test(m.Note)));

    // ---- Stock count sets quantities and zeroes what was not found ----
    $('doneHome').click();
    document.querySelector('[data-mode=COUNT]').click();
    await waitFor(() => visible('view-scan'));
    ['P059K6158X', 'P059K6158X', 'P059K6158X'].forEach(c => A.handleCode(c, 'barcode'));
    $('scanNext').click(); await waitFor(() => visible('view-review'));
    const zeroFams = Array.from($('zeroList').querySelectorAll('input')).map(i => i.value);
    check('count lists parts on record but not scanned, including one below zero', zeroFams.includes('P999K1234X') && zeroFams.includes('P053K9189X') && stockOf(site.SiteID, 'P053K9189X') < 0, zeroFams);
    $('reviewSend').click();
    check('count saved', await waitFor(() => visible('view-done') && $('doneTitle').textContent === 'Count saved') && await saved());
    check('count result: feed roll 3, new part 0, below-zero part back to 0', stockOf(site.SiteID, 'P059K6158X') === 3 && stockOf(site.SiteID, 'P999K1234X') === 0 && stockOf(site.SiteID, 'P053K9189X') === 0);
    check('site last-count date set', !!rows('Sites')[0].LastCount);

    // ---- Offline: saved on the phone, sent later, never twice ----
    $('doneHome').click();
    apiDown = true;
    document.querySelector('[data-mode=BOOK_IN]').click();
    await waitFor(() => visible('view-scan'));
    A.handleCode('P004E1900X', 'barcode');
    $('scanNext').click(); await waitFor(() => visible('view-review'));
    $('reviewSend').click();
    check('offline send is kept on the phone', await waitFor(() => visible('view-done') && /saved on this phone/i.test($('doneStatus').textContent)), $('doneStatus').textContent);
    check('offline record shown in site stock straight away', (A.state.data.stock.find(s => s.family === 'P004E1900X') || {}).qty === 1);
    check('queue holds one record', A.state.queue.length === 1);
    const queued = JSON.parse(JSON.stringify(A.state.queue[0]));
    // Background sync (Android): the waiting record is copied where the service worker can send it with the app closed
    await sleep(150);
    const box = await PTOutbox.list();
    check('waiting record copied to the background-sync outbox', box.length === 1 && box[0].batchId === queued.batchId && box[0].action === 'submit' && box[0].session === A.state.session, box);
    let bgErr = '';
    try { await PTOutbox.send(() => Promise.reject(new Error('offline'))); } catch (e) { bgErr = e.message; }
    check('background send with no signal fails (so Chrome retries) and keeps the record', /No signal/.test(bgErr) && (await PTOutbox.list()).length === 1, bgErr);
    const viaBackend = async (url, opt) => ({ ok: true, json: async () => call(JSON.parse(opt.body)) });
    const bg = await PTOutbox.send(viaBackend);
    check('background send delivers it with the app closed', bg.sent === 1 && (await PTOutbox.list()).length === 0 && stockOf(site.SiteID, 'P004E1900X') === 1, bg);
    const movesAfterBg = rows('Movements').length;
    apiDown = false;
    await A.syncQueue(true);
    check('queued record sent when back online', A.state.queue.length === 0 && stockOf(site.SiteID, 'P004E1900X') === 1);
    check('the app sending it again after background sync is not recorded twice', rows('Movements').length === movesAfterBg);
    await sleep(150);
    check('outbox empty once the app has sent everything', (await PTOutbox.list()).length === 0);
    const before = rows('Movements').length;
    const dup = call(Object.assign({ action: 'submit' }, queued));
    check('a resent record is ignored', dup.ok && dup.duplicate && rows('Movements').length === before, dup);

    // ---- My van: the engineer's own stock, no QR code ----
    appendObjects_('VanKit', [
      { Family: 'P059K6158X', Min: 2, Max: 4 },
      { Family: '059K58130', Min: 1, Max: 2 },      // box code: stored as P059K5813X
      { Family: 'P004E1900X', Min: 0, Max: 1 }
    ]);
    $('doneHome').click();
    check('engineer sees the Site / My van switch', await waitFor(() => !$('whereSwitch').hidden));
    document.querySelector('#whereSwitch [data-where=van]').click();
    check('My van opens for the signed-in engineer', await waitFor(() => visible('view-van') && $('vanName').textContent === 'Test Engineer'), $('vanName').textContent);
    check('empty van: kit lists the parts below minimum', await waitFor(() => $('vanKitList').children.length === 2), $('vanKitStatus').textContent);
    check('order quantity tops up to maximum', /Order 4/.test($('vanKitList').textContent) && /Order 2/.test($('vanKitList').textContent), $('vanKitList').textContent);

    document.querySelector('[data-van-mode=BOOK_IN]').click();
    check('van book-in screen', await waitFor(() => visible('view-scan') && $('scanTitle').textContent === 'Book in to my van'));
    A.handleCode('FFB059K61580', 'barcode'); A.handleCode('P059K6158X', 'barcode'); A.handleCode('P059K6158X', 'barcode');
    $('scanNext').click(); await waitFor(() => visible('view-review'));
    $('reviewSend').click();
    check('van book-in saved', await waitFor(() => visible('view-done') && $('doneHome').textContent === 'Back to my van') && await saved());
    check('stock recorded against the van', stockOf('VAN-E01', 'P059K6158X') === 3 && rows('Movements').some(m => m.SiteID === 'VAN-E01' && m.By === 'Test Engineer' && m.Type === 'BOOK_IN'));
    check('site stock not changed by a van book-in', stockOf(site.SiteID, 'P059K6158X') === 3);
    $('doneHome').click();
    check('back to the van after sending', await waitFor(() => visible('view-van')));
    check('kit check updated: only the nudger roll is short', await waitFor(() => JSON.stringify(A.vanShortfall().map(k => k.family)) === '["P059K5813X"]'), A.vanShortfall());
    check('order list for copying', A.orderLines().length === 1 && /P059K5813X/.test(A.orderLines()[0]) && /x2$/.test(A.orderLines()[0]), A.orderLines());
    // Order parts: review, then the Smartsheet form opens filled in
    window.PT_CONFIG.orderFormUrl = 'https://app.smartsheet.com/b/form/TESTFORM';
    let opened = null;
    window.open = url => { opened = url; };
    $('orderParts').click();
    check('order parts opens a review list', await waitFor(() => $('sheetTitle').textContent === 'Order van stock' && $('sheetBody').querySelectorAll('li').length === 1));
    [...$('sheetBody').querySelectorAll('button')].find(b => b.textContent === 'Open order form').click();
    const form = opened ? new URL(opened) : null;
    const f = k => form && form.searchParams.get(k);
    check('order form link goes to the Smartsheet form', form && form.origin + form.pathname === 'https://app.smartsheet.com/b/form/TESTFORM', opened);
    check('order form fixed fields filled in', f('Parts Reason') === 'CAR STOCK' && f('SD CALL No.') === 'Van Kit' && f('ByBox/Collection') === 'Yes' && f('Customer Name') === 'Test Engineer');
    check('order form part line filled in', f('1 Part No.') === 'P059K5813X' && f('1 Qty') === '2' && f('1 Description') === 'Tray 1/2 Feed Roll - Nudger', [f('1 Part No.'), f('1 Qty'), f('1 Description')]);
    check('ordered part is flagged and not ordered again', await waitFor(() => /Ordered/.test($('vanKitList').textContent)) && A.orderLines().length === 0);
    window.confirm = () => true;
    $('vanKitList').querySelector('.ordered-badge').click();
    check('tapping Ordered marks it as not ordered', A.orderLines().length === 1 && !$('vanKitList').querySelector('.ordered-badge'));
    $('orderParts').click();
    await waitFor(() => $('sheetTitle').textContent === 'Order van stock');
    [...$('sheetBody').querySelectorAll('button')].find(b => b.textContent === 'Open order form').click();
    check('re-ordered part shows the Ordered badge again', await waitFor(() => !!$('vanKitList').querySelector('.ordered-badge')));
    const sixParts = ['5 Part code', '5 qty', '5 Part Description '].every(k => new URL(A.smartsheetUrl([1, 2, 3, 4, 5].map(i => ({ family: 'P059K6158X', qty: i })))).searchParams.has(k));
    check('form row 5 uses its own field names (incl. trailing space)', sixParts);
    document.querySelector('[data-van-mode=BOOK_IN]').click();
    await waitFor(() => visible('view-scan'));
    A.handleCode('059K58130', 'barcode'); A.handleCode('059K58130', 'barcode');
    $('scanNext').click(); await waitFor(() => visible('view-review'));
    $('reviewSend').click();
    await waitFor(() => visible('view-done')); await saved();
    $('doneHome').click();
    check('booking the ordered part in clears it from the order list', await waitFor(() => visible('view-van') && A.vanShortfall().every(k => k.family !== 'P059K5813X')), A.vanShortfall());

    document.querySelector('[data-van-mode=USED]').click();
    await waitFor(() => visible('view-scan'));
    A.handleCode('P059K6158X', 'barcode');
    $('scanNext').click(); await waitFor(() => visible('view-review'));
    $('jobNo').value = 'J2001'; $('reviewSend').click();
    check('used on a job from the van', await waitFor(() => visible('view-done')) && await saved() && stockOf('VAN-E01', 'P059K6158X') === 2);
    const usedRow = rows('Movements').find(m => m.SiteID === 'VAN-E01' && m.Type === 'USED');
    check('van use has the job number', usedRow && usedRow.JobNo === 'J2001' && usedRow.Qty === -1, usedRow);

    const vanStock = call({ action: 'van', session: A.state.session });
    check('van data comes back for the engineer', vanStock.ok && vanStock.van.id === 'VAN-E01' && vanStock.kit.length === 3, vanStock);
    const vanNoSignIn = call({ action: 'submit', van: true, batchId: 'v1', type: 'BOOK_IN', items: [{ code: 'P059K6158X', qty: 1 }] });
    check('van needs a signed-in engineer', !vanNoSignIn.ok && vanNoSignIn.code === 'forbidden', vanNoSignIn);
    const vanFitted = call({ action: 'submit', van: true, session: A.state.session, batchId: 'v2', type: 'CUSTOMER_FITTED', items: [{ code: 'P059K6158X', qty: 1 }] });
    check('customer-fitted is not a van action', !vanFitted.ok && vanFitted.code === 'bad_request', vanFitted);

    $('doneHome').click();
    document.querySelector('#whereSwitch [data-where=site]').click();
    check('switch back to the site', await waitFor(() => visible('view-home') && $('siteName').textContent === 'Sample Print Co'));

    // ---- Unused breakdown parts: taken from the site to the van, later returned to Ceva from the van ----
    const kitsSheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Kits');
    appendObjects_('Kits', [{ Model: 'PC1120', Family: 'P059K6158X', Qty: 3 }]);   // for these checks only: this site's kit has 3 feed rolls
    const siteStockBefore = stockBySite_(site.SiteID);   // put back afterwards for the checks that follow
    await A.loadSite();
    check("engineers get the site's Up Time Kit for the kit warning", (A.state.data.kit || {}).P059K6158X === 3, A.state.data.kit);
    check('engineers see Take to my van', !tile('TO_VAN').hidden);
    const takeFrom = new Date(Date.now() - 1);
    tile('TO_VAN').click();
    check('Take to my van opens the scanner, in orange', await waitFor(() => visible('view-scan') && $('scanTitle').textContent === 'Take to my van' && $('view-scan').classList.contains('tone-orange')));
    A.handleCode('P059K6158X', 'barcode');   // 3 on record here, all of them the kit
    A.handleCode('P127K5896X', 'barcode');   // never booked in here
    $('scanNext').click(); await waitFor(() => visible('view-review'));
    const takeWarn = $('reviewWarn').textContent;
    check('review warns about a part not on record at the site', !$('reviewWarn').hidden && /Not on record at this site/.test(takeWarn) && /Fusing Web Motor/.test(takeWarn), takeWarn);
    check("review warns when the site's Up Time Kit would be left short", /Up Time Kit short/.test(takeWarn) && /Tray 1\/2 Feed Roll \(kit 3, would leave 2\)/.test(takeWarn), takeWarn);
    check('call number asked for, optional', !$('jobCard').hidden && /optional/.test($('jobLabel').textContent), $('jobLabel').textContent);
    check('no failed-on-fit tick when taking parts', !$('reviewList').querySelector('.fail-tick'));
    $('jobNo').value = 'C5001';
    $('reviewSend').click();
    check('parts taken to the van', await waitFor(() => visible('view-done') && $('doneTitle').textContent === 'Taken to your van' && /2 parts taken from Sample Print Co into your van/.test($('doneText').textContent)) && await saved(), $('doneText').textContent);
    const toVan = rows('Movements').filter(m => m.Type === 'TO_VAN'), fromSite = rows('Movements').filter(m => m.Type === 'FROM_SITE');

    check('admins see the training machine as no kit', trainAdmin && trainAdmin.machines[0].noKit === true);
    // Headings typed differently and other ways of ticking still count

    prSheet.getRange(1, col_('Printers', 'NoKit')).setValue('No Kit ');
    const trainRow = rows('Printers').find(p => p.SiteID === 'S1999')._row;
    const tickedAs = v => { prSheet.getRange(trainRow, col_('Printers', 'NoKit')).setValue(v); return kitTopUp_().some(k => k.site.SiteID === 'S1999'); };
    check('No kit works with heading "No Kit " and values x, Yes, ✓, true', !tickedAs('x') && !tickedAs('Yes') && !tickedAs('✓') && !tickedAs(true) && tickedAs(false) && tickedAs(''), rows('Printers').find(p => p.SiteID === 'S1999'));
    tickedAs(true);
    const prCols = prSheet.getLastColumn(); runSetup();
    check('setup does not add a second No kit column', prSheet.getLastColumn() === prCols);
    appendObjects_('Movements', [{ MovementID: 'x1', Timestamp: new Date(), SiteID: 'S1999', Family: 'P059K6158X', ExactCode: 'P059K6158X', Qty: -1, Type: 'USED', By: 'T', Role: 'engineer' }]);
    check('parts used on a No kit machine are left out of the kit email', !kitUsage_(new Date(Date.now() - 60000), new Date(Date.now() + 1000)).some(u => u.site.SiteID === 'S1999'));
    appendObjects_('Movements', [{ MovementID: 'x2', Timestamp: new Date(), SiteID: 'S1999', Family: 'P059K6158X', ExactCode: 'P059K6158X', Qty: 1, Type: 'COUNT', By: 'T', Role: 'engineer' }]);
    const movesAfter = rows('Movements').length;
    fillKitStock();
    check('running it again adds nothing', rows('Movements').length === movesAfter);
    check('filling kits does not trigger the kit email', sendDailyKitReport() === 0 && mail.length === 0);

    // ---- A kit quantity lowered on the Kits tab: only assumed stock is taken back, never at counted sites ----
    const kitsTab = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Kits');
    const scBtr = rows('Kits').find(k => cleanModel_(k.Model) === 'SC180' && k.Family === 'P859K4874X');
    const dg = rows('Sites').find(s => s.Name === 'Demo Graphics Ltd');
    const machinesAt = model => rows('Printers').filter(p => String(p.SiteID) === String(dg.SiteID) && !noKit_(p) && cleanModel_(p.Model) === model).length;
    appendObjects_('Movements', [{ MovementID: 'real-btr', Timestamp: new Date(), SiteID: dg.SiteID, Family: 'P859K4874X', ExactCode: 'P859K4874X', Qty: 2, Type: 'BOOK_IN', By: 'Customer', Role: 'customer' }]);
    const btrBefore = stockOf(dg.SiteID, 'P859K4874X');
    const kitAdded = rows('Movements').filter(m => m.SiteID === dg.SiteID && m.Family === 'P859K4874X' && m.By === 'Kit setup').reduce((n, m) => n + Number(m.Qty), 0);
    kitsTab.getRange(scBtr._row, col_('Kits', 'Qty')).setValue(0);   // as if SC180s no longer carried a 2nd BTR
    const wantLow = machinesAt('EC1100');
    setLastCount(dg, new Date());
    const movesCounted = rows('Movements').length;
    fillKitStock();
    check('a counted site is never changed by the kit fill', rows('Movements').length === movesCounted);
    setLastCount(dg, '');
    fillKitStock();
    const btrAfter = stockOf(dg.SiteID, 'P859K4874X');
    check('a lowered kit quantity takes back only the assumed stock, never a real delivery', kitAdded > 0 && btrAfter === btrBefore - Math.min(btrBefore - wantLow, kitAdded) && btrAfter >= 2 &&
      rows('Movements').some(m => m.Type === 'KIT_ADJUST' && m.SiteID === dg.SiteID && m.Qty < 0 && /Kit list corrected/.test(m.Note)), [btrBefore, kitAdded, wantLow, btrAfter]);
    const movesFixed = rows('Movements').length;
    fillKitStock();
    check('running the correction again changes nothing', rows('Movements').length === movesFixed);
    kitsTab.getRange(scBtr._row, col_('Kits', 'Qty')).setValue(1);
    fillKitStock();
    check('raising it again tops the assumed stock back up', stockOf(dg.SiteID, 'P859K4874X') === Math.max(machinesAt('SC180') + machinesAt('EC1100'), btrAfter), stockOf(dg.SiteID, 'P859K4874X'));
    check('kit corrections do not trigger the kit email', sendDailyKitReport() === 0 && mail.length === 0);

    // ---- Surplus report ----
    const daysAgo = d => new Date(Date.now() - d * 86400000 - 3600000);
    appendObjects_('Sites', [{ SiteID: 'S1777', Name: 'Surplus Test Ltd', Address: 'Hull', Postcode: 'HU1 1AA', Token: 'surplustesttoken0000000000000001', Active: true, LastCount: new Date() }]);
    appendObjects_('Printers', [{ SiteID: 'S1777', Model: 'SC180', Serial: 'SUR-1' }]);
    const mv = (id, f, q, type, t) => ({ MovementID: id, Timestamp: t || new Date(), SiteID: 'S1777', Family: f, ExactCode: f, Qty: q, Type: type, By: 'T', Role: 'engineer' });
    appendObjects_('Movements', [
      mv('s1', 'P859K4874X', 3, 'BOOK_IN'),                    // kit part, kit is 1: 2 surplus straight away
      mv('s2', 'P053K0668X', 1, 'BOOK_IN'),                    // kit part at the kit level: fine
      mv('s3', 'P127K5896X', 2, 'BOOK_IN', daysAgo(90)),       // not in the kit, idle 90 days: surplus
      mv('s4', 'P023E2950X', 2, 'BOOK_IN', daysAgo(90)), mv('s5', 'P023E2950X', -1, 'USED', daysAgo(10)),   // used 10 days ago: 50 days left
      mv('s6', 'P004E1900X', 1, 'BOOK_IN')]);                  // just delivered: 60 days left
    const adm = actionAdmin({ session: call({ action: 'login', site: 'admin', pin: '9999' }).session });
    const si = adm.sites.findIndex(x => x.id === 'S1777');
    const sur = adm.surplus.filter(r => r[0] === si), soon = adm.surplusSoon.filter(r => r[0] === si);
    const line = f => sur.find(r => r[1] === f);
    check('surplus: above the kit counts straight away, only the extra', JSON.stringify(line('P859K4874X')) === JSON.stringify([si, 'P859K4874X', 2, 'kit', 1]) && !line('P053K0668X'), sur);
    check('surplus: a part outside the kit, idle 90 days, all of it', line('P127K5896X') && line('P127K5896X')[2] === 2 && line('P127K5896X')[3] === 'idle' && line('P127K5896X')[4] >= 90, sur);
    check('surplus: parts used or delivered recently are becoming surplus, with the days left', !line('P023E2950X') && !line('P004E1900X') &&
      soon.some(r => r[1] === 'P023E2950X' && r[2] === 1 && r[3] === 50) && soon.some(r => r[1] === 'P004E1900X' && r[3] === 60) && adm.surplusDays === 60, soon);
    check('surplus: vans are left out', !adm.surplus.some(r => !adm.sites[r[0]]));
    if (A.state.user && /admin/i.test(A.state.user.role)) {
      A.admin.data = null;
      A.openAdmin();
      await waitFor(() => A.admin.data && A.admin.data.surplus && $('adminUpdating').hidden);
      document.querySelector('[data-admin-tab=surplus]').click();
      const surText = $('admin-surplus').textContent;
      check('Surplus tab lists the site, the parts and why', visible('admin-surplus') && /Surplus Test Ltd/.test(surText) && /2nd BTR/.test(surText) && /Above the kit: kit is 1/.test(surText) &&
        /Not used or delivered for 9\d days/.test(surText) && /Becoming surplus/.test(surText) && /surplus in 50 days/.test(surText), surText.slice(0, 400));
    } else check('Surplus tab check needs the admin signed in', false, A.state.user);

    // ---- Safeguards on the Movements tab ----
    const mvSheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName('Movements');
    runSetup();
    check('setup puts one warning-only protection on Movements', mvSheet.getProtections().length === 1 && mvSheet.getProtections()[0].warningOnly === true);
    delete window.__gas.sheets.Movements;
    let setupErr = '', appErr = '';
    try { runSetup(); } catch (e) { setupErr = String(e.message); }
    try { sheet_('Movements'); } catch (e) { appErr = String(e.message); }
    check('a deleted Movements tab is never replaced with an empty one', /Version history/.test(setupErr) && !window.__gas.sheets.Movements && /Version history/.test(appErr), setupErr);
    window.__gas.sheets.Movements = mvSheet;

    // ---- Archive old movements: stock must not change ----
    const tsCol = col_('Movements', 'Timestamp'), mvTotal = mvSheet.getLastRow() - 1;
    const longAgo = new Date(Date.now() - 400 * 86400000);
    for (let r = 2; r <= mvTotal - 4; r++) mvSheet.getRange(r, tsCol).setValue(new Date(longAgo.getTime() + r * 1000));   // all but the last 5 are 400 days old
    const recent5 = rows('Movements').slice(-5).map(m => m.MovementID);
    const stockBeforeArchive = JSON.stringify(stockTotals_());
    installDailyReport(); window.__gas.props.kitReportUpTo = String(longAgo.getTime() - 86400000);
    check('movements the kit email has not reported are never archived', archivePlan_().old.length === 0);
    removeDailyReport();
    previewArchive();
    check('archive preview changes nothing', rows('Movements').length === mvTotal && JSON.stringify(stockTotals_()) === stockBeforeArchive);
    const plan = archivePlan_();
    archiveMovements();
    const book = Object.values(window.__gas.books)[0];
    const archived = book && book.getSheetByName('Movements');
    check('old movements copied to a new archive spreadsheet, linked on the Settings tab', archived && archived.getLastRow() - 1 === mvTotal - 5 &&
      rows('Settings').find(r => r.Setting === 'ArchiveSheet').Value === book.getUrl(), archived && archived.getLastRow());
    check('every stock level is unchanged after archiving', JSON.stringify(stockTotals_()) === stockBeforeArchive);
    const mvAfter = rows('Movements');
    check('Movements is now carried-forward lines then the recent 5, in order', mvAfter.length === plan.carried.length + 5 && mvAfter.length < mvTotal &&
      mvAfter.slice(0, -5).every(m => m.Type === 'CARRIED_FORWARD' && m.Qty !== 0) && JSON.stringify(mvAfter.slice(-5).map(m => m.MovementID)) === JSON.stringify(recent5), [mvAfter.length, plan.carried.length, mvTotal]);
    const archivedCount = archived.getLastRow();
    archiveMovements();
    check('running the archive again does nothing', rows('Movements').length === mvAfter.length && archived.getLastRow() === archivedCount && JSON.stringify(stockTotals_()) === stockBeforeArchive);
    // A year later: new old movements are archived, the carried-forward lines are folded in but never archived twice
    for (let r = mvAfter.length - 3; r <= mvAfter.length + 1; r++) mvSheet.getRange(r, tsCol).setValue(new Date(longAgo.getTime() + 999000 + r));
    archiveMovements();
    check('a second archive adds only real movements to the archive and keeps stock', archived.getLastRow() === archivedCount + 5 &&
      JSON.stringify(stockTotals_()) === stockBeforeArchive && rows('Movements').every(m => m.Type === 'CARRIED_FORWARD'), archived.getLastRow() - archivedCount);
    // My van still opens once the van's history has been archived
    const vanAfterArchive = call({ action: 'van', session: A.state.session });
    check('van loads after its history is archived', vanAfterArchive.ok && Array.isArray(vanAfterArchive.stock), 'ok=' + vanAfterArchive.ok + ' err=' + vanAfterArchive.error + ' code=' + vanAfterArchive.code + ' stock=' + (vanAfterArchive.stock || []).length + ' session=' + !!A.state.session);
    $('doneHome') && $('doneHome').click();
    document.querySelector('#whereSwitch [data-where=site]').click();
    await sleep(50);
    document.querySelector('#whereSwitch [data-where=van]').click();
    check('My van opens after archiving, for whoever is signed in', await waitFor(() => visible('view-van') && $('vanName').textContent === A.state.user.name), [visible('view-van'), $('vanName').textContent, $('whereSwitch').hidden, document.querySelector('#whereSwitch [data-where=van]').disabled]);
    // The ?van link (and the home-screen shortcut) opens My van straight away, wherever the app was
    document.querySelector('#whereSwitch [data-where=site]').click();
    await waitFor(() => visible('view-home'));
    await A.route(new URLSearchParams('van'));
    check('the ?van link opens My van straight away, with the site still there behind it', await waitFor(() => visible('view-van')) && !document.querySelector('#whereSwitch [data-where=site]').disabled);
    const manifest = await (await fetch('../web/manifest.webmanifest')).json();
    check('the home-screen icon has a My van shortcut', (manifest.shortcuts || []).some(s => s.url === './?van' && s.name === 'My van'));

    // Easter egg: everything falls off My van, then it is all put back exactly as it was
    window.PT_EGG_SPEED = 0.02;
    await waitFor(() => $('vanUpdating').hidden && !/Loading/.test($('vanSummary').textContent));
    const vanBefore = $('view-van').innerHTML, topBefore = document.querySelector('.topbar').textContent;
    $('doNotPress').scrollIntoView();   // pressed at the bottom of the page, as it always is
    $('doNotPress').click();
    check('Do not press: the letters are wrapped to fall and taps are blocked', document.body.classList.contains('falling') && $('view-van').querySelectorAll('.fall-char').length > 50);
    check('Do not press: the cards swing off, then a message', await waitFor(() => document.querySelector('.fall-box')) && await waitFor(() => /you were told/.test((document.querySelector('.egg-message') || {}).textContent || '')));
    document.getAnimations().forEach(a => { try { a.finish(); } catch (e) {} });   // where every piece ends up
    const stillOnScreen = [...document.querySelectorAll('.fall-box, .fall-char')].filter(e => e.getClientRects().length && e.getBoundingClientRect().top < innerHeight - 2);
    check('Do not press: everything has fallen off the screen before the message', stillOnScreen.length === 0, stillOnScreen.slice(0, 5).map(e => [e.className, e.textContent.slice(0, 20), Math.round(e.getBoundingClientRect().top)]));
    check('Do not press: everything is put back exactly as it was', await waitFor(() => !document.body.classList.contains('falling')) && !document.documentElement.classList.contains('egg') && !document.querySelector('.fall-char, .fall-box, .egg-message') &&
      $('view-van').innerHTML.replace('I said do NOT press', 'Do not press') === vanBefore && document.querySelector('.topbar').textContent === topBefore && $('doNotPress').textContent === 'I said do NOT press',
      (() => { const a = $('view-van').innerHTML.replace('I said do NOT press', 'Do not press'); let i = 0; while (i < a.length && a[i] === vanBefore[i]) i++; return [a.slice(i - 60, i + 80), vanBefore.slice(i - 60, i + 80)]; })());
    document.querySelector('#whereSwitch [data-where=site]').click();
    check('the app still works after the easter egg', await waitFor(() => visible('view-home')));
    document.querySelector('#whereSwitch [data-where=van]').click();
    await waitFor(() => visible('view-van'));
    check('archive spreadsheet holds no carried-forward lines', archived.getDataRange().getValues().slice(1).every(r => !r.includes('CARRIED_FORWARD')));
  } catch (e) {
    check('test run crashed', false, String(e && e.stack || e));
  }
  finish();
})();
</script>
